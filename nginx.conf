server {
  listen 8080;
  root /usr/share/nginx/html;

  # The load balancer checks this to know the container is up.
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Always fetch the latest, so a redeploy reaches the next install.
  location ~ \.(sh|zip|html)$ {
    add_header Cache-Control "no-cache";
  }
  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  types {
    text/html html;
    text/css css;
    text/plain sh;
    application/zip zip;
  }
}
